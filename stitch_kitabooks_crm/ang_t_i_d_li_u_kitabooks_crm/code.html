<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary": "#6b5c4a",
                        "on-background": "#211b13",
                        "surface-bright": "#fff8f4",
                        "secondary-fixed-dim": "#d7c3ae",
                        "tertiary-fixed": "#f7dfc4",
                        "primary": "#825500",
                        "on-error-container": "#93000a",
                        "surface-container-low": "#fff1e5",
                        "on-primary-fixed": "#291800",
                        "tertiary": "#6d5c46",
                        "outline-variant": "#d6c4b0",
                        "on-primary-container": "#412800",
                        "secondary-container": "#f1dcc6",
                        "on-tertiary-fixed": "#251909",
                        "surface-container-high": "#f3e6da",
                        "inverse-on-surface": "#fcefe2",
                        "on-secondary": "#ffffff",
                        "on-error": "#ffffff",
                        "primary-container": "#c8881c",
                        "inverse-surface": "#362f27",
                        "on-secondary-container": "#6f604e",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed-variant": "#524434",
                        "error-container": "#ffdad6",
                        "secondary-fixed": "#f4dfc9",
                        "tertiary-container": "#a6927a",
                        "on-tertiary-fixed-variant": "#544430",
                        "on-surface": "#211b13",
                        "inverse-primary": "#ffb952",
                        "tertiary-fixed-dim": "#d9c3a9",
                        "surface": "#fff8f4",
                        "background": "#fff8f4",
                        "primary-fixed-dim": "#ffb952",
                        "on-tertiary-container": "#392b19",
                        "error": "#ba1a1a",
                        "surface-dim": "#e4d8cc",
                        "on-primary-fixed-variant": "#633f00",
                        "surface-tint": "#825500",
                        "primary-fixed": "#ffddb3",
                        "surface-container": "#f9ecdf",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed": "#241a0c",
                        "outline": "#837563",
                        "surface-variant": "#ede0d4",
                        "surface-container-lowest": "#ffffff",
                        "on-surface-variant": "#514535",
                        "surface-container-highest": "#ede0d4"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-padding-mobile": "20px",
                        "base": "8px",
                        "gutter": "24px",
                        "section-gap": "64px",
                        "container-padding-desktop": "40px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "display-lg": ["Literata"],
                        "label-md": ["Inter"],
                        "headline-lg": ["Literata"],
                        "caption": ["Inter"],
                        "headline-lg-mobile": ["Literata"],
                        "headline-md": ["Literata"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "300"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "300"}],
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "300"}],
                        "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "300"}],
                        "caption": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
                        "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "300"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "300"}]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .quill-animation {
            transform-origin: bottom right;
            animation: quill-write 3s ease-in-out infinite;
        }
        @keyframes quill-write {
            0%, 100% { transform: rotate(-5deg) translateX(0); }
            25% { transform: rotate(10deg) translateX(10px); }
            50% { transform: rotate(-10deg) translateX(20px); }
            75% { transform: rotate(5deg) translateX(10px); }
        }
        .glass-card {
            backdrop-filter: blur(16px);
            background-color: rgba(251, 248, 241, 0.8);
            border: 1px solid rgba(168, 153, 128, 0.3);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen overflow-hidden">
<!-- Background Content (Blurred Dashboard Mockup) -->
<div class="fixed inset-0 z-0 flex blur-md opacity-40 select-none pointer-events-none">
<!-- SideNavBar Mockup -->
<aside class="h-screen w-72 bg-surface-container-low border-r border-outline-variant/20 p-6 space-y-8">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-secondary-container"></div>
<div class="space-y-1">
<div class="w-24 h-4 bg-on-surface-variant/20 rounded"></div>
<div class="w-16 h-2 bg-on-surface-variant/10 rounded"></div>
</div>
</div>
<nav class="space-y-4">
<div class="w-full h-10 bg-secondary-container/50 rounded-lg"></div>
<div class="w-full h-10 bg-surface-variant/20 rounded-lg"></div>
<div class="w-full h-10 bg-surface-variant/20 rounded-lg"></div>
<div class="w-full h-10 bg-surface-variant/20 rounded-lg"></div>
</nav>
</aside>
<!-- Main Content Mockup -->
<main class="flex-1 p-10 space-y-10">
<header class="flex justify-between items-center">
<div class="w-64 h-8 bg-on-surface-variant/20 rounded"></div>
<div class="flex gap-4">
<div class="w-10 h-10 rounded-full bg-surface-variant/30"></div>
<div class="w-10 h-10 rounded-full bg-surface-variant/30"></div>
</div>
</header>
<!-- Bento Grid Mockup -->
<div class="grid grid-cols-12 gap-6 h-full">
<div class="col-span-8 bg-surface-container-high/40 rounded-[20px] h-64 border border-outline-variant/10"></div>
<div class="col-span-4 bg-surface-container-high/40 rounded-[20px] h-64 border border-outline-variant/10"></div>
<div class="col-span-4 bg-surface-container-high/40 rounded-[20px] h-96 border border-outline-variant/10"></div>
<div class="col-span-8 bg-surface-container-high/40 rounded-[20px] h-96 border border-outline-variant/10"></div>
</div>
</main>
</div>
<!-- Loading Overlay -->
<div class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-surface/40 backdrop-blur-sm">
<!-- Top Logo -->
<div class="absolute top-12 flex flex-col items-center">
<img alt="Kitabooks Logo" class="h-20 w-auto opacity-90 mb-2" src="https://lh3.googleusercontent.com/aida/ADBb0uiAB8250wFzVrzW8Xz6OheEf-o2vzxkPm_XMPake1CxDeJTwI_2UFh-5yx9ON5HEkS3G99K7uxN5c6tCF6XUHQ_85vOXg54cae-pIMZXMmv4SYeAgZqq6nob9beHe4hj-lvlJD2925ZCvj7Xbs6oBTzEPrgjnakL6tEp9WB9zLA1GZZh5D88a1AX6VWiprKmhO9mcRgAF2VZn9mxzIcQI8QJNJVNOsWqL1Wx47ZW0rKPn_CpJPDPBkBP_g"/>
</div>
<!-- Center Loading Animation -->
<div class="relative flex flex-col items-center">
<!-- Animated Quill & Paper -->
<div class="relative w-48 h-48 flex items-center justify-center mb-8">
<!-- Decorative Circles (Classical Pattern) -->
<div class="absolute inset-0 border-[0.5px] border-outline-variant/30 rounded-full animate-[spin_10s_linear_infinite]"></div>
<div class="absolute inset-4 border-[0.5px] border-outline-variant/50 rounded-full animate-[spin_15s_linear_infinite_reverse]"></div>
<!-- The Paper Surface -->
<div class="w-32 h-40 glass-card rounded-sm transform rotate-[-2deg] flex flex-col p-4 space-y-3 overflow-hidden shadow-sm">
<div class="w-full h-[1px] bg-outline-variant/20"></div>
<div class="w-full h-[1px] bg-outline-variant/20"></div>
<div class="w-3/4 h-[1px] bg-outline-variant/20"></div>
<div class="w-full h-[1px] bg-outline-variant/20"></div>
<div class="w-full h-[1px] bg-outline-variant/20"></div>
<div class="w-1/2 h-[1px] bg-outline-variant/20"></div>
<!-- Animated text line effect -->
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-surface/60 to-transparent w-full h-full -translate-x-full animate-[shimmer_2.5s_infinite]"></div>
</div>
<!-- The Quill -->
<div class="absolute bottom-12 right-6 quill-animation">
<span class="material-symbols-outlined text-primary text-6xl select-none" data-icon="edit_note" style="font-variation-settings: 'FILL' 0, 'wght' 200;">
                        edit_note
                    </span>
</div>
</div>
<!-- Loading Text -->
<div class="text-center space-y-3">
<h2 class="font-headline-md text-headline-md text-on-surface">Đang mở kho lưu trữ di sản...</h2>
<div class="flex items-center justify-center gap-1.5">
<div class="w-1 h-1 rounded-full bg-primary/40 animate-bounce [animation-delay:-0.3s]"></div>
<div class="w-1 h-1 rounded-full bg-primary/60 animate-bounce [animation-delay:-0.15s]"></div>
<div class="w-1 h-1 rounded-full bg-primary animate-bounce"></div>
</div>
</div>
</div>
<!-- Footer / Cultural Quote -->
<div class="absolute bottom-12 px-10 text-center">
<p class="font-body-md text-secondary italic opacity-70 max-w-md">
                "Một cuốn sách thực sự không bao giờ được viết xong. Nó luôn chờ đợi một người curator tận tâm để tiếp nối hành trình."
            </p>
</div>
</div>
<style>
        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }
    </style>
</body></html>
