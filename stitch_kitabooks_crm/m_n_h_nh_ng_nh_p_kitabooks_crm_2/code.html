        .overlay {
            position: fixed;

        .input-underlined {

            border: none;
            border-bottom: 1px solid rgba(168, 153, 128, 0.3);

<!-- 1. Logo -->
<div class="flex justify-center">
<img alt="Kitabooks Logo" class="h-[48px] w-auto" src="https://lh3.googleusercontent.com/aida/ADBb0uiAB8250wFzVrzW8Xz6OheEf-o2vzxkPm_XMPake1CxDeJTwI_2UFh-5yx9ON5HEkS3G99K7uxN5c6tCF6XUHQ_85vOXg54cae-pIMZXMmv4SYeAgZqq6nob9beHe4hj-lvlJD2925ZCvj7Xbs6oBTzEPrgjnakL6tEp9WB9zLA1GZZh5D88a1AX6VWiprKmhO9mcRgAF2VZn9mxzIcQI8QJNJVNOsWqL1Wx47ZW0rKPn_CpJPDPBkBP_g"/>
</div>

<div class="text-center">
<h1 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-[#3A2E1F] leading-tight">
                    Chào mừng trở lại nhà sách
                </h1>
<p class="font-body-lg text-[14px] text-[#6B5A45] mt-2">
                    Đăng nhập để tiếp tục
                </p>
</div>
<!-- 4. Input Email -->
<div class="flex flex-col gap-1 mt-4">
<label class="font-label-md text-label-md text-[#6B5A45]" for="email">Email</label>
<input class="input-underlined font-body-md text-on-surface py-2" id="email" placeholder="ten@kitabook.vn" type="email"/>
</div>
<!-- 5. Input Password -->
<div class="flex flex-col gap-1 relative">
<label class="font-label-md text-label-md text-[#6B5A45]" for="password">Mật khẩu</label>
<div class="relative">
<input class="input-underlined w-full font-body-md text-on-surface py-2 pr-10" id="password" type="password"/>
<button class="absolute right-0 top-1/2 -translate-y-1/2 flex items-center" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- 6. Button Primary -->
<button class="w-full h-[44px] bg-[#C8881C] text-[#291800] font-label-md rounded-[8px] mt-2 hover:opacity-90 transition-opacity">
                Đăng nhập
            </button>
<!-- 7. Divider -->
<div class="flex items-center gap-4 py-2">
<div class="h-[1px] flex-1 bg-[#EDE6D6]"></div>
<span class="font-caption text-[13px] text-[#A89980]">— hoặc —</span>
<div class="h-[1px] flex-1 bg-[#EDE6D6]"></div>
</div>

<button class="btn-google flex items-center justify-center gap-3 w-full h-[44px] rounded-[8px] bg-transparent text-[#6B5A45] font-label-md">
